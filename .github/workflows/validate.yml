name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check plugin contracts
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-plugins.py ${BASE:+--base "$BASE"}
      - name: Run validation suites
        run: |
          mkdir -p .scratch
          scratch=$(mktemp -d "$PWD/.scratch/v.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          declare -A pids=()
          run_suite() {
            local name=$1
            shift
            (
              export TMPDIR="$scratch/$name"
              mkdir "$TMPDIR" && "$@"
            ) >"$scratch/$name.log" 2>&1 &
            pids[$name]=$!
          }
          run_suite rules env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py' -v
          run_suite ledger python3 plugins/ship/hooks/ultraship_test.py
          run_suite teardown bash plugins/chief/skills/run/scripts/lane-teardown.test.sh
          run_suite shell bash -n plugins/ship/skills/*/scripts/*.sh plugins/chief/skills/run/scripts/*.sh
          failed=0
          for name in rules ledger teardown shell; do
            if [[ -n ${pids[$name]:-} ]]; then
              status=0
              wait "${pids[$name]}" || status=$?
              printf '%s: exit %s\n' "$name" "$status"
              if (( status != 0 )); then
                failed=1
              fi
            else
              printf '%s: missing result\n' "$name"
              failed=1
            fi
            cat "$scratch/$name.log" || failed=1
          done
          exit "$failed"
