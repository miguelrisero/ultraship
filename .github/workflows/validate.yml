name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check plugin contracts
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-plugins.py ${BASE:+--base "$BASE"}
      - name: Test hooks and ledger
        run: |
          mkdir -p .scratch
          TMPDIR="$PWD/.scratch" python3 plugins/ship/hooks/ultraship_test.py
      - name: Test worktree teardown
        run: |
          mkdir -p .scratch
          TMPDIR="$PWD/.scratch" bash plugins/chief/skills/run/scripts/lane-teardown.test.sh
      - name: Check shell scripts
        run: bash -n plugins/ship/skills/*/scripts/*.sh plugins/chief/skills/run/scripts/*.sh
